name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the version PR / tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance via OIDC

jobs:
  # Gate: nothing is released unless lint, typecheck, tests and build all pass.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Lint
        run: yarn nx run-many -t lint
      - name: Typecheck
        run: yarn nx run-many -t typecheck
      - name: Unit tests + coverage
        run: yarn nx run-many -t test
      - name: Build
        run: yarn nx run-many -t build

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Configure npm auth for publishing
        shell: bash
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish scoped packages publicly, with provenance (see id-token above).
          NPM_CONFIG_PROVENANCE: 'true'

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the version PR / tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance via OIDC

jobs:
  # Gate: nothing is released unless lint, typecheck, tests and build all pass.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Lint
        run: yarn nx run-many -t lint
      - name: Typecheck
        run: yarn nx run-many -t typecheck
      - name: Unit tests + coverage
        run: yarn nx run-many -t test
      - name: Build
        run: yarn nx run-many -t build

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Configure npm auth for publishing
        shell: bash
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # When changesets are present, open/update the "Version Packages" PR.
      # This only bumps versions on a PR branch; it never publishes.
      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Explicitly build and publish. publish-dist.mjs is idempotent: versions
      # already on the registry are skipped, so this is a no-op unless the
      # version PR was just merged (i.e. main carries an unpublished bump).
      - name: Build and publish to npm
        run: yarn build && node tools/publish-dist.mjs
        env:
          # Publish scoped packages publicly, with provenance (see id-token above).
          NPM_CONFIG_PROVENANCE: 'true'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
      - name: Prettier check
        run: yarn format:check
      - name: Lint
        run: yarn nx affected -t lint --base=$NX_BASE --head=$NX_HEAD
      - name: Typecheck
        run: yarn nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
      - name: Vitest + coverage
        run: yarn nx affected -t test --base=$NX_BASE --head=$NX_HEAD

  build:
    name: Build & package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Build all packages
        run: yarn nx run-many -t build
      - name: Verify package contents (npm pack --dry-run)
        run: |
          set -euo pipefail
          for pkg in dist/packages/*/; do
            echo "::group::npm pack --dry-run $pkg"
            npm pack --dry-run --json "./$pkg" | node -e '
              const data = JSON.parse(require("fs").readFileSync(0, "utf8"))[0];
              console.log(`${data.name}@${data.version} — ${data.files.length} files`);
              for (const f of data.files) console.log("  " + f.path);
              const forbidden = data.files.filter((f) => /\.spec\.|test-setup|\/testing\//.test(f.path));
              if (forbidden.length) { console.error("Forbidden files in package:", forbidden.map((f) => f.path)); process.exit(1); }
            '
            echo "::endgroup::"
          done

  smoke:
    name: Load built packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build with the repo's own Node (Angular's toolchain sets the floor),
      # then switch runtimes below to check the artifacts actually load on the
      # versions the pure packages claim to support.
      - name: Setup Node & Yarn
        uses: ./.github/actions/setup
      - name: Build all packages
        run: yarn nx run-many -t build

      - name: Switch to Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # `npm pack --dry-run` above checks what goes into the tarball. This packs
      # each built package, installs it into a throwaway project, and requires
      # and imports it for real — the check that would have caught the pure
      # packages shipping ESM-only, which resolves fine on new Node via
      # require(esm) and fails outright on 18 and 20.
      - name: Require + import each built package
        run: node tools/smoke-test-dist.mjs
